###############################################################################
#
## Configuration file for A pure Netfilter Firewall for Linxu
#
# Lines that begin with # are ignored
# Valid values are true, enable, false, disable
# Keys are unique so it's easy to update with Ansible
# Keys and values will be converted to lower case no matter what's in this file
# Every key and sub-ley must begins with a letter: [a-z]
#   Numbers are not allowed as the first character
#     tcp2194 is valid
#     2194tcp is invalid
#
# New services have to be added to templates/<family>/base.rules
#   Created in templates/<family>/<inbound|outbound>/<service>.rules
#
# Adding to base.rules is tricky.
#   One entry in the inbound section
#   One new chain
#   One entry in the outbound section
#
###############################################################################

###############################################################################
#
## Sane rules to start with
#
###############################################################################
inbound.ssh: enable
outbound.ssh: enable
outbound.dhcp: enable
outbound.dns: enable
outbound.ntp: enable
outbound.http: enable
outbound.https: enable

###############################################################################
#
## Optional rules
#
###############################################################################
inbound.smtp: disable
inbound.tcp2194: disable
inbound.tcp8000: disable
inbound.http: disable
inbound.https: disable
inbound.syslogtls: disable
inbound.baculadirector: disable
inbound.baculafiledaemon: disable
inbound.baculastoragedaemon: disable
inbound.udp1514: disable
# Tor, split by port: a relay routinely runs an ORPort without a DirPort, and DirPort is
# deprecated in current Tor. outbound.tor below is separate again - it is the skuid grant
# that lets the daemon out, not a port anybody connects to.
inbound.orport: disable
inbound.dirport: disable
inbound.btc: disable

## WireGuard
#
# Off, because an open UDP port is not a sane default for a package. But on a host that
# already carries a tunnel, leaving it off means the firewall takes that tunnel down the
# moment it loads - silently, since a tunnel does not fail loudly, it just stops
# handshaking. On a host reached THROUGH the tunnel that is the last thing observed of it.
#
# Enable the side the host is. Dialled peers - the ones with a fixed address - want
# inbound. The peer that dials, whose own address is dynamic, wants outbound.
inbound.wireguard: disable

outbound.smtp: disable
outbound.tcp2194: disable
outbound.tcp8000: disable
outbound.syslogtls: disable
outbound.baculadirector: disable
outbound.baculafiledaemon: disable
outbound.baculastoragedaemon: disable
outbound.udp1514: disable
outbound.tor: disable
outbound.btc: disable
outbound.wireguard: disable
inbound.postgres: disable
inbound.udp51821: disable
