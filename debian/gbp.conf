# git-buildpackage, told the layout rather than left to guess it.
#
# Without this gbp assumes the packaging branch is `master` and stops with
# "You are not on branch 'master'", so every build needed flags nobody remembers.
[DEFAULT]
debian-branch = debian/latest
upstream-branch = upstream/latest
upstream-tag = upstream/latest/%(version)s
debian-tag = debian/latest-%(version)s
# PRISTINE-TAR IS ON, AND THE PACKAGE HAD TO STOP BEING NATIVE FOR IT TO MEAN ANYTHING.
#
# What it does: keeps a binary delta in a `pristine-tar` branch so `pristine-tar checkout` can
# regenerate a BYTE-IDENTICAL copy of an upstream tarball from git. Debian's source format records
# the orig tarball's checksum in the .dsc, so a rebuild has to reproduce those exact bytes rather
# than make equivalent ones - and gzip does not promise the same output twice across versions.
#
# IT WAS SET TO True AND DOING NOTHING. `debian/source/format` said `3.0 (native)`, and a native
# package has no orig tarball at all - packaging and source are one thing. So gbp answered every
# export with "Nothing to be done for native package", and the pristine-tar branch stops dead at
# 20240921.0.4, the last release before the package went native. A year of releases went past a
# setting that could not fire.
#
# `3.0 (quilt)` is what makes the mechanism real: an orig tarball built from upstream/latest, the
# packaging carried separately on this branch, and a Debian revision on the version. It is also
# the arrangement the branches were already in - upstream/latest holds the source, debian/latest
# holds only debian/ - so nothing moves except the format and the version scheme.
pristine-tar = True

[buildpackage]
# BUILD OUTSIDE THE WORKING TREE. This is the fix for build products appearing as
# untracked files in a packaging branch and then following a merge into another one.
# With an export directory the tree is never written to, so `git status` stays clean
# and there is nothing to accidentally carry across.
export-dir = ../build-area/
