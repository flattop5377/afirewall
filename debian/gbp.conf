# git-buildpackage, told the layout rather than left to guess it.
#
# Without this gbp assumes the packaging branch is `master` and stops with
# "You are not on branch 'master'", so every build needed flags nobody remembers.
[DEFAULT]
debian-branch = debian/latest
upstream-branch = upstream/latest
upstream-tag = upstream/latest/%(version)s
debian-tag = debian/latest-%(version)s
# PRISTINE-TAR IS OFF, and it was on.
#
# What it does: keeps a binary delta in a `pristine-tar` branch so `pristine-tar checkout` can
# regenerate a BYTE-IDENTICAL copy of an upstream tarball from git. That matters when somebody
# else ships the tarball and Debian's .dsc records its checksum, so a rebuild has to reproduce
# their bytes rather than make equivalent ones.
#
# Nobody else ships this tarball. We are upstream, gbp builds it from the upstream tag at release
# time, and no archive outside this project records a checksum to match. So it was storing deltas
# against tarballs only we produce, to reproduce bytes only we would compare.
#
# It also went stale on 2026-08-16: history was rewritten to remove comments describing one
# operator's network, so the deltas no longer match the trees they were computed from, and
# `pristine-tar checkout` for 20260815.0.0 would produce a tarball that disagrees with its own tag.
# A mechanism that is silently wrong is worse than one that is absent.
#
# Turn it back on if this package is ever uploaded to Debian proper, where the checksum in the
# .dsc is somebody else's to check.
pristine-tar = False

[buildpackage]
# BUILD OUTSIDE THE WORKING TREE. This is the fix for build products appearing as
# untracked files in a packaging branch and then following a merge into another one.
# With an export directory the tree is never written to, so `git status` stays clean
# and there is nothing to accidentally carry across.
export-dir = ../build-area/
