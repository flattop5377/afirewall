# PYTEST CONFIG LIVES HERE AND NOT IN pyproject.toml, DELIBERATELY.
#
# `47658bf Removed packaging files` took pyproject.toml off master on purpose: under the gbp
# layout the packaging lives on debian/latest and master carries only the source. Putting the
# goldspec's pytest settings into a file of that name re-created it with completely different
# content, so merging master into upstream/latest would have collided two unrelated files that
# happen to share a name.
#
# The wrong resolution is the dangerous one. debian/latest's pyproject.toml is where the project
# metadata lives - including `license = {file = "LICENSE-SHORT.txt"}` and the
# `License :: OSI Approved :: Apache Software License` classifier - so a merge that took master's
# side would silently drop the package's licence declaration while everything still built.
#
# pytest reads pytest.ini in preference to pyproject.toml anyway, and no packaging tool looks at
# it, so the two concerns stop sharing a filename.
[pytest]
testpaths = spec drills test
pythonpath = spec drills .
python_files = chapter_*.py test_*.py
python_functions = test_* ch[0-9]*_[0-9]*
markers =
    proves(id, depth): a drill citing the chapter claim it proves, at a depth
    informs(id, about): a drill citing a claim it bears on, naming the aspect
