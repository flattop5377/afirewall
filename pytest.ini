# PYTEST CONFIG LIVES HERE AND NOT IN pyproject.toml, AND NOW THERE IS NO pyproject.toml AT ALL.
#
# `47658bf Removed packaging files` took it off master first, because under the gbp layout the
# packaging lives on debian/latest and master carries only the source. Putting the goldspec's
# pytest settings into a file of that name would have re-created it with completely different
# content, so merging master into upstream/latest would have collided two unrelated files sharing
# a name - and the dangerous resolution was the plausible one, since taking master's side would
# have silently dropped the package's licence declaration while everything still built.
#
# On 2026-08-17 the Python deliverable was retired entirely and pyproject.toml went with it, so the
# collision this file was avoiding can no longer happen. It stays here anyway: pytest reads
# pytest.ini in preference, and the reason to keep test configuration out of a packaging file does
# not depend on that packaging file existing.
[pytest]
testpaths = spec drills test
pythonpath = spec drills .
python_files = chapter_*.py test_*.py
python_functions = test_* ch[0-9]*_[0-9]*
markers =
    proves(id, depth): a drill citing the chapter claim it proves, at a depth
    informs(id, about): a drill citing a claim it bears on, naming the aspect
