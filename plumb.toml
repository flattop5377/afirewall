# What this project declares about itself. One file, read by Plumb for every language.
adapter = "python"

# `stories` is deliberately unset: a declared set handed over as data is a second home for ids
# whose first home is the chapter's trace table. Subjects are discovered from what the drills cite.
# stories = ...

production   = ["afirewall"]
sources      = ["afirewall"]

# WHERE THE WIRED SYSTEM BEGINS. This said `[]` with the note "the generator is run as a command
# against a config and a template tree; there is no request entering a wired system" - which is a
# true description of the shape and was the wrong conclusion. A command IS an entry point; what was
# missing was something to name, because afirewall.py ended in `if __name__ == "__main__":` and had
# no callable at all.
#
# What the empty list cost: grounding never ran, so every behavioural subject here answered
# `passed-wiring-not-verified` - nine of them once chapters 4 and 8 landed. Grounding is what
# catches orphaned code, and a package that cannot be entered cannot be asked.
entry_points = ["afirewall.afirewall:main"]

# Off because it is slow, not because it is optional. `plumb board --mutation` for a run.
mutation = false

# WHAT IS SETTLED BY READING, and it is most of this chapter. A limit's posture, the config's
# shape, the absence of iptables and the presence of an argument beside a rule are all facts about
# the tree. What is NOT settled that way is whether a limit set above a bounded legitimate rate
# refuses abuse without refusing use — that is a claim about traffic (ch1-U2), and it stays
# unwatched rather than being answered by a template that parses.
[archetypes]
"ch1-1" = "structural"
"ch1-2" = "structural"
"ch1-4" = "structural"
"ch1-6" = "structural"
"ch1-7" = "structural"
# ch1-9 IS SHAPE: four chains exist, run ahead of every service decision, and read no flag. That is
# settled by reading. Whether they DROP what they claim to is traffic, and belongs with ch1-U2.
"ch1-9" = "structural"
# CHAPTER 2 IS STRUCTURAL BECAUSE IT IS ABOUT A TOOL'S SHAPE — does an authoring path exist, does
# it take a name rather than a bare port, does it refuse a posture with no reason, does it write
# both families. All of that is settled by reading, and all of it currently reads as absent, which
# is why every one of these is red rather than unwatched. The behavioural half — a generated
# template loading into a kernel — is ch1-7's and needs root.
"ch2-2" = "structural"
"ch2-3" = "structural"
"ch2-4" = "structural"
"ch2-5" = "structural"
"ch2-6" = "structural"
"ch2-7" = "structural"
# CHAPTER 3 IS THE SHAPE OF AN INTERFACE — does a subcommand exist, does it refuse a dead flag,
# does it distinguish a no-op, does it say so in something a caller cannot misread. All of that is
# settled by running the command against this tree, which needs no host and no root. What is NOT
# settled is that a real converge goes quiet on its second pass (ch3-U3), which needs a fleet.
"ch3-2" = "structural"
"ch3-3" = "structural"
"ch3-4" = "structural"
"ch3-5" = "structural"
"ch3-6" = "structural"
# CHAPTER 5 IS THE SHAPE OF THE REPOSITORY, which is exactly what a release depends on and
# exactly what a written procedure cannot keep true. Whether a branch has commits nobody else has,
# whether packaging sits where it belongs, whether a release is tagged in both places - all read
# from git. What is NOT settled here is the nft floor's actual number (ch5-U1, needs an old nft)
# and whether a real release runs without a question (ch5-U2).
# ch5-1 and ch5-8 read files and refs rather than running anything - the release sequence being
# present, and the artifacts a finished release leaves behind. Both are inspection, and the board
# is right to want that said rather than inferred.
"ch5-1" = "structural"
"ch5-2" = "structural"
"ch5-3" = "structural"
"ch5-4" = "structural"
"ch5-5" = "structural"
"ch5-6" = "structural"
"ch5-7" = "structural"
"ch5-8" = "structural"
# CHAPTER 6 IS SHAPE: whether a stated interface can be read at all, from where, whether silence
# still works, and whether anything refuses a name that is not there. All settled by reading, and
# all currently reading as absent. What is NOT settled is a host actually filtering the interface
# its operator meant (ch6-U2), which needs a host with a tunnel and a moved default route.
"ch6-2" = "structural"
"ch6-3" = "structural"
"ch6-4" = "structural"
"ch6-5" = "structural"
"ch6-6" = "structural"
"ch6-7" = "structural"
# ch6-9 asks get_spoofed_networks what it computes, which runs production code rather than reading it.

# CHAPTER 7 IS WHERE FILES GO, which is stated in debian/afirewall.install and in the loader, and
# is therefore settled by reading. What is NOT is an upgrade actually behaving (ch7-U2), which needs
# two releases and a host to take one. ch7-3 and ch7-5 are NOT declared here: they import the
# module to read its constants - which is executing it, and the board was right to refuse the
# word "structural" for that. They read the assignments out of the source instead.
"ch7-1" = "structural"
"ch7-2" = "structural"
"ch7-3" = "structural"
"ch7-5" = "structural"
"ch7-4" = "structural"
"ch7-6" = "structural"
# CHAPTER 8 IS BEHAVIOURAL ALMOST THROUGHOUT, AND THE BOARD HAD TO SAY SO. These were declared
# structural first and came back as `structural.executed`, which is correct: every one of them
# asks the RESOLVER — load_catalogue, service_bodies — rather than reading a file, so production
# code runs and what passes is an exercise of the shape rather than a reading of it.
#
# That execution is the point rather than an accident. Chapter 2's drills read the source text of
# an authoring path and passed for as long as `add_service` did not exist; chapter 1's read
# templates and passed through three broken chains. A chapter whose subject is "the wiring is
# derived" cannot be settled by looking at the thing the wiring is no longer written in. So the
# archetypes are left undeclared and these subjects answer as behavioural.
#
# ch8-11 IS the exception and is genuinely inspection: it counts files on disk and imports nothing.
"ch8-11" = "structural"
# CHAPTER 4 IS TWO SHAPES AND THE SPLIT IS THE POINT. What can be read is read: whether the forward
# table is emitted conditionally, whether a blanket conntrack accept has appeared in it, whether
# afirewall.conf has grown a host-level `forward` flag, and whether enabling the first forwarded
# service still announces ch4-9. Those are the template and the config file, and inspection settles
# them. Everything else asks the resolver or the kernel and is left undeclared, so it answers as
# behavioural — ch4-7 is reachability through a third namespace and is carried by tools/lab.py.
"ch4-2" = "structural"
"ch4-3" = "structural"
# ch4-9 reads afirewall.py's own text for the announcement, which is inspection like the two above.
"ch4-9" = "structural"
