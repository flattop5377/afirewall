# THE CATALOGUE. One record per service per direction, and the single place a service's name
# exists — see spec/diagrams/chapter-08-declaration.md. The wiring in base.rules is derived
# from these, so adding a service here is the whole of adding a service.
#
# `because` is chapter 1's argument for the posture and is not decoration: a limit-bearing
# record without one is refused. The rate and count are NOT argued anywhere and never were —
# they were inherited from whichever template was copied to make the next one, and seeing them
# in one table is the first time that has been visible. That is ch8-U1.
#
# Two services are absent on purpose: outbound tor and btc select on `meta skuid` rather than a
# port and keep their hand-written templates (ch8-6, ch8-7).

[[service]]
name = "baculadirector"
direction = "inbound"
title = "Bacula Director Rules"
ports = ["tcp/9101"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
recorded as what the rules do, not as an argued choice.

NOTHING HAS EXERCISED THIS TEMPLATE. It ships with the package and has no traffic behind
it, so the posture below is inherited from the templates beside it rather than chosen. If
you deploy bacula, make the argument against its own behaviour before believing this.
"""

