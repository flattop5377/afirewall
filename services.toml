[[service]]
name = "dhcp"
direction = "outbound"
title = "Allow Outbound DHCP"
ports = ["udp/67"]
ports_ipv6 = ["udp/547"]
# THE ONE SERVICE WHOSE REPLY IS NOT A CONNTRACK REPLY, and the only reason `reply` exists. A
# client that broadcasts its request is answered from the server's own unicast address, so the
# tuples do not match, the reply arrives INVALID or NEW, and a rule asking for ESTABLISHED never
# fires. Deriving this one like every other reply produced exactly that rule, and the migration
# only caught it because the old and new rulesets were diffed rather than reasoned about.
reply = ["udp sport 67 udp dport 68 accept"]
reply_ipv6 = ["udp sport 547 udp dport 546 accept"]

