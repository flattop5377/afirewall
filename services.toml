[[service]]
name = "btc"
direction = "inbound"
title = "BTC Rules"
ports = ["tcp/8333"]
posture = "enforce"
rate = "50/minute"
count = 200
because = """
the counterparty is anonymous, self-replacing, and does not
share its address with anyone who matters.

The source is forgeable, so this is the third branch of ch1-3 rather than the easy one:
what makes enforcing safe is not that the address is trustworthy but that refusing it
costs nothing. A bitcoin node holds on the order of a hundred inbound peers and replaces
a lost one within minutes, so the collateral of a wrong drop is one interchangeable peer
for the 90s this set holds it — unlike ssh, smtp or syslog, where the party refused is
one the operator chose and cannot substitute. A legitimate peer opens about one
connection, three orders of magnitude under these limits, so a real peer never reaches
them. What enforcing buys is concrete: without it, one address may hold 200+ concurrent
connections and occupy the daemon's inbound slots by itself.
"""

[[service]]
name = "dirport"
direction = "inbound"
title = "Tor DirPort Rules"
description = """
 The directory port. Deprecated in current Tor - a relay that publishes directory data now
 generally serves it over its ORPort instead - so this is here to be left off, and exists
 separately so that leaving it off does not also close the ORPort.
"""
ports = ["tcp/9030"]
posture = "enforce"
rate = "50/minute"
count = 200
because = """
the counterparty is anonymous, self-replacing, and does not
share its address with anyone who matters.

Same argument as the ORPort beside it: the source is forgeable, but a directory client
refused here is interchangeable and reconnects, so the collateral of a wrong drop is
nobody the operator chose. Note that this flag is meant to be left disabled — current Tor
serves directory data over the ORPort — so the posture matters mainly for being correct
if it is ever turned on.
"""

[[service]]
name = "http"
direction = "inbound"
title = "HTTP Rules"
ports = ["tcp/80"]
posture = "instrument"
rate = "50/minute"
count = 200
because = """
a per-source bound is a bound on a crowd, not on a client.

A CGNAT range or an office behind one address shares this allowance, so a limit tight
enough to matter refuses legitimate readers before it refuses anything else. Nothing in
HTTP bounds a legitimate rate from above either: one page load opens several
connections and a reader can reload. Counted and admitted.
"""

[[service]]
name = "https"
direction = "inbound"
title = "HTTPS Rules"
ports = ["tcp/443"]
posture = "instrument"
rate = "50/minute"
count = 200
because = """
a per-source bound is a bound on a crowd, not on a client.

A CGNAT range or an office behind one address shares this allowance, so a limit tight
enough to matter refuses legitimate readers before it refuses anything else. Nothing in
HTTPS bounds a legitimate rate from above either: one page load opens several
connections and a reader can reload. Counted and admitted.
"""

[[service]]
name = "orport"
direction = "inbound"
title = "Tor ORPort Rules"
description = """
 The relay port, which other relays and clients connect to. Split from DirPort because a
 relay routinely runs one without the other: DirPort is deprecated in current Tor, and
 relays that still publish directory data mostly serve it over the ORPort. A port nobody
 needs open should not be opened by the same switch as one that is.
"""
ports = ["tcp/9001"]
posture = "enforce"
rate = "50/minute"
count = 200
because = """
the counterparty is anonymous, self-replacing, and does not
share its address with anyone who matters.

The source is forgeable, so this is the third branch of ch1-3 rather than the easy one:
what makes enforcing safe is not that the address is trustworthy but that refusing it
costs nothing. Tor is redundant by design — a relay or client refused here reconnects,
or reaches the network by another path — so the collateral of a wrong drop is one
interchangeable peer for as long as the set holds it, unlike ssh, smtp or syslog where
the party refused is one the operator chose. A legitimate peer's rate sits far under these
limits, and what enforcing buys is that a single address cannot occupy the relay by
itself.
"""

[[service]]
name = "postgres"
direction = "inbound"
title = "POSTGRES Rules"
ports = ["tcp/5432"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
the client is a host the operator chose and cannot substitute,
so a limit that drops would hand anyone able to forge a SYN the power to cut a named
application off its database. The legitimate rate is bounded - a pooled client opens a
handful of connections and holds them - which makes enforcing available and still wrong,
for the same reason syslog's is.
"""

[[service]]
name = "smtp"
direction = "inbound"
title = "SMTP Rules"
ports = ["tcp/25"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
the collateral is a named correspondent, and it is aimable.

Enforcing would hand anyone able to forge a SYN the ability to defer mail from one
chosen sender for the 900s this set holds them. SMTP's own retry makes a drop
recoverable rather than fatal, which is the honest argument for enforcing here — but a
large sender's legitimate burst is not bounded below 5/minute, so the rule would refuse
real mail before it refused abuse. Counted and admitted.
"""

[[service]]
name = "ssh"
direction = "inbound"
title = "SSH Rules"
ports = ["tcp/22"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
the administrative path is the one service an operator cannot
afford to lose, and a limit that drops is a limit an attacker aims.
"""

[[service]]
name = "syslogtls"
direction = "inbound"
title = "Ssylog TLS Rules"
ports = ["tcp/6514"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
this port carries the evidence.

The legitimate rate genuinely is bounded: a shipper opens one connection and holds it,
so 5/minute is orders of magnitude clear of anything real, and enforcing is available.
It is still the wrong answer. A limit that drops can be aimed at exactly the host an
attacker is working on, and silencing that host's logs is the point of the exercise. A
rule that lets a stranger suppress an audit trail on demand is worse than no rule.
"""

[[service]]
name = "tcp2194"
direction = "inbound"
title = "TCP 2194 Rules"
ports = ["tcp/2194"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
the authentication is what keeps strangers out, not this.

2194 is unassigned at IANA, so a host answering on it is running something whose clients
it knows by name rather than something the internet dials. Where the transport
authenticates before it carries anything, the handshake is what refuses a stranger, not
this. Enforcing would add exactly one capability — anyone able to forge a known client's
address can lock that client out — and none the authentication does not already have.
"""

[[service]]
name = "tcp8000"
direction = "inbound"
title = "TCP 8000 Rules — a check-in collector"
description = """
 Where a fleet pushes a heartbeat to one collector and the ABSENCE of one raises
 the alarm, this port carries the signal that says the others are still working.
 Inbound is wanted only on the collector; a host that merely checks in needs the
 outbound half.
"""
ports = ["tcp/8000"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
enforcing would let a stranger manufacture alarms.

Where absence of a heartbeat raises the alarm, a limit that drops turns a
forged flood into an alert for a host that is perfectly healthy. An alarm anybody can
induce is an alarm the operator learns to ignore, and losing the alerting system's
credibility costs more than accepting the flood does.
"""

[[service]]
name = "udp1514"
direction = "inbound"
title = "UDP 1514 Rules"
ports = ["udp/1514"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
this port carries the evidence, over a transport with no
handshake to survive.

UDP source addresses cost nothing to forge, so an enforcing limit here could be aimed at
any shipper by anyone at all: the attacker never has to receive a reply. Silencing the
logs of the host being attacked is the point of the exercise, and a rule that offers
that on demand is worse than no rule. Counted and admitted.
"""

[[service]]
name = "udp51821"
direction = "inbound"
title = "UDP 51821 Rules"
description = """
 A second WireGuard instance, on a port that is not the default. A host that runs more than
 one tunnel needs a second listener, and 51820 is already spoken for; the number here is
 arbitrary and the template is named for it rather than for whatever the tunnel carries.
"""
ports = ["udp/51821"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
the same argument as inbound.wireguard, and for the same
reasons.

WireGuard answers load with a cookie, which is a rate defence that can still tell a real
peer from a forged one; this rule cannot. The source is UDP and costs nothing to forge,
and a peer on a tunnel is one the operator chose rather than one of a crowd — so a limit
that drops would let anyone silence exactly the tunnel the rule exists to protect.
"""

[[service]]
name = "wireguard"
direction = "inbound"
title = "WireGuard Rules"
description = """
 Symmetric with the outbound template, and only one half of it runs here.

 A WireGuard peer whose address moves cannot be dialled, so the peer with the dynamic
 address has to be the one that initiates - it is the only side that always knows where
 the other one is. That makes the fixed-address side purely dialled: it listens, it
 replies, and it never originates. So on a host of that shape only `inbound.wireguard`
 is ever enabled, and the outbound template sits unused until the host becomes a dialer.

 Which side a host is is not something a firewall can detect, so both exist and the
 config picks. See templates/{family}/outbound/wireguard.rules.
"""
ports = ["udp/51820"]
posture = "instrument"
rate = "5/minute"
count = 20
because = """
WireGuard already refuses load better than a packet filter
can, and this rule is keyed on an address that legitimately moves.

Under pressure WireGuard answers with a cookie: a rate defence that can still tell a
real peer from a forged one, which nothing here can do. And the peer on this key is the
dialer, whose address is dynamic by the design recorded above — so enforcing would spend
a renumbered peer's allowance on forged traffic and refuse the very tunnel the rule
exists for. Counted and admitted.
"""

