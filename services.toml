[[service]]
name = "wireguard"
direction = "outbound"
title = "Outbound WireGuard Rules"
description = """
 For the peer that dials. Enable this where the host initiates the tunnel - which is
 the peer whose own address is dynamic, since it is the only one that can reliably find
 the other end. A host that is dialled needs the inbound template and not this one.
"""
ports = ["udp/51820"]

# THE TWO THE RECORD CANNOT FULLY SAY (ch8-6, ch8-7). Both select on the local socket's owner
# rather than a port, carry one set rather than two, put the rate inline rather than in a set, and
# order their rules the other way round — four differences, not one. So their BODY stays a
# hand-written template and only the wiring is derived here, which is the escape hatch doing
# exactly what it is for: a record still exists, so the jump and the reply still come from one
# place and still cannot disagree.
[[service]]
name = "tor"
direction = "outbound"
selector = "meta skuid debian-tor"

[[service]]
name = "btc"
direction = "outbound"
selector = "meta skuid btc"
